name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTA: Se eliminó 'tools' de la lista de paquetes ya que está deprecado y causa el error 1.
          # En su lugar, especificamos las herramientas modernas necesarias:
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34
            cmdline-tools;latest

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
