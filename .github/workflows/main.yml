name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Command-line Tools
        run: |
          # Definir directorio del SDK
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p $HOME/android-sdk/cmdline-tools
          
          # Descargar la última versión oficial de las command-line tools de Android
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          
          # Descomprimir y estructurar correctamente para que sdkmanager funcione
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdline-tools.zip
          
          # Agregar sdkmanager al PATH de la sesión actual
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Licenses and Install Packages
        run: |
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"
          
          # Aceptar licencias automáticamente
          yes | sdkmanager --licenses || true
          
          # Instalar platform-tools, build-tools y la plataforma de Android
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace
        env:
          ANDROID_HOME: ${{ home }}/android-sdk
